name: Refresh market snapshot and deploy Pages

on:
  schedule:
    # 8:17 PM Eastern, after the expected end-of-day data refresh and outside
    # the busy top-of-hour Actions queue.
    - cron: "17 20 * * 1-5"
      timezone: "America/New_York"
    # Retry later if the backend run was unusually slow or GitHub delayed the
    # first scheduled run. The script is a no-op when the session is unchanged.
    - cron: "17 22 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapshot dependency
        run: python -m pip install --disable-pip-version-check psycopg2-binary

      - name: Open read-only database tunnel
        env:
          SNAPSHOT_SSH_KEY: ${{ secrets.PUBLIC_SNAPSHOT_SSH_KEY }}
          SNAPSHOT_SSH_KNOWN_HOSTS: ${{ secrets.PUBLIC_SNAPSHOT_SSH_KNOWN_HOSTS }}
          SNAPSHOT_SSH_TARGET: ${{ secrets.PUBLIC_SNAPSHOT_SSH_TARGET }}
        run: |
          set -euo pipefail
          : "${SNAPSHOT_SSH_TARGET:?PUBLIC_SNAPSHOT_SSH_TARGET is not configured}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SNAPSHOT_SSH_KEY" > "$HOME/.ssh/vcp-snapshot-tunnel"
          chmod 600 "$HOME/.ssh/vcp-snapshot-tunnel"
          printf '%s\n' "$SNAPSHOT_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          ssh -fN \
            -i "$HOME/.ssh/vcp-snapshot-tunnel" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -L 15433:127.0.0.1:5433 \
            "$SNAPSHOT_SSH_TARGET"

          for attempt in $(seq 1 20); do
            if python - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 15433), timeout=1):
              pass
          PY
            then
              exit 0
            fi
            sleep 1
          done
          echo "The read-only PostgreSQL tunnel did not open" >&2
          exit 1

      - name: Build verified session snapshot
        env:
          PUBLIC_SNAPSHOT_DATABASE_URL: ${{ secrets.PUBLIC_SNAPSHOT_DATABASE_URL }}
          PUBLIC_SNAPSHOT_URL: ${{ vars.PUBLIC_SNAPSHOT_URL || format('https://{0}.github.io/{1}/current.json', github.repository_owner, github.event.repository.name) }}
        run: python scripts/refresh_snapshot.py --output current.json --html-input index.html --html-output index.html --sitemap sitemap.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p .pages-artifact
          cp app.js index.html LICENSE logo-icon.svg logo.svg README.md sample-snapshot.json sitemap.xml strategy.json styles.css current.json googleef37d6d965b16b06.html .pages-artifact/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
